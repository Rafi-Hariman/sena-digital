<div class="wedding-container">
  <!-- Loading State -->
  <div class="wedding-loading" *ngIf="isLoading">
    <div class="loading-spinner">
      <i class="fas fa-heart fa-beat" style="color: #e91e63; font-size: 2rem;"></i>
    </div>
    <h3 style="margin-top: 1rem; color: #666;">Loading Wedding Invitation...</h3>
    <p style="color: #888;">Please wait while we prepare your special moment</p>
  </div>

  <!-- Error State -->
  <div class="wedding-error" *ngIf="errorMessage && !isLoading">
    <div class="error-icon" style="font-size: 3rem; color: #dc3545; margin-bottom: 1rem;">
      <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h3 style="color: #dc3545; margin-bottom: 1rem;">Oops! Something went wrong</h3>
    <p class="error-message">{{ errorMessage }}</p>
    <button class="retry-button" (click)="retryLoadData()">
      <i class="fas fa-redo-alt" style="margin-right: 0.5rem;"></i>
      Try Again
    </button>
    <p style="margin-top: 1rem; color: #666; font-size: 0.9rem;">
      If the problem persists, please contact support or
      <a href="/" style="color: #007bff; text-decoration: none;">return to homepage</a>
    </p>
  </div>

  <!-- Main Wedding Content - only show when data is loaded -->
  <div *ngIf="hasWeddingData() && !isLoading && !errorMessage">
    <div class="floral-bg"></div>

    <!-- Gallery view - properly isolated -->
    <wc-gallery-view
      *ngIf="isCurrentView(ContentView.GALLERY)"
      [userId]="weddingData?.user_info?.id">
    </wc-gallery-view>

    <!-- Main content - hidden when gallery is active -->
    <div class="content" *ngIf="!isCurrentView(ContentView.GALLERY)">
      <div class="wrap" *ngIf="isCurrentView(ContentView.MAIN)">
        <p class="wedding-header">The Wedding Of</p>
        <h1 class="couple-names">{{ getCoupleDisplayName() }}</h1>
        <p class="greeting">Kepada Yth.</p>
        <p class="formal-address">Bapak/Ibu/Saudara/i</p>
        <p class="guest-name">Nama Tamu</p>
        <button class="open-invitation-btn" (click)="openInvitation()">Buka Undangan</button>
      </div>

      <!-- Scrollable content container for all sections -->
      <div class="scrollable-content" *ngIf="isCurrentView(ContentView.COUPLE)">

        <!-- Section 1: Couple -->
        <section
          class="full-section"
          id="section-couple"
          *ngIf="isCoupleVisible()">
          <wc-couple-view [weddingData]="weddingData"></wc-couple-view>
        </section>

        <!-- Section 2: Messages -->
        <section
          class="full-section"
          id="section-messages"
          *ngIf="isMessagesVisible()">
          <wc-message-view [guestWishes]="weddingData?.guest_wishes"></wc-message-view>
        </section>

        <!-- Section 3: Akad -->
        <section
          class="full-section"
          id="section-akad"
          *ngIf="isCalendarVisible()">
          <wc-akad-view [events]="weddingData?.events" [eventType]="'akad'"></wc-akad-view>
        </section>

        <!-- Section 4: Resepsi -->
        <section
          class="full-section"
          id="section-resepsi"
          *ngIf="isBirthdayVisible()">
          <wc-resepsi-view [events]="weddingData?.events" [eventType]="'resepsi'"></wc-resepsi-view>
        </section>

        <!-- Section 5: Story -->
        <section
          class="full-section"
          id="section-story"
          *ngIf="isChatVisible()">
          <wc-story-view [stories]="weddingData?.stories"></wc-story-view>
        </section>

        <!-- Section 6: Presence -->
        <section
          class="full-section"
          id="section-presence"
          *ngIf="isProfileVisible()">
          <wc-presence-view [weddingData]="weddingData || undefined"></wc-presence-view>
        </section>

        <!-- Section 7: Gift -->
        <section
          class="full-section"
          id="section-gift"
          *ngIf="isGiftsVisible()">
          <wc-gift-view [weddingData]="weddingData || undefined"></wc-gift-view>
        </section>

        <!-- Section 8: Comment -->
        <section
          class="full-section"
          id="section-comment"
          *ngIf="isCommentsVisible()">
          <wc-comment-view [weddingData]="weddingData || undefined"></wc-comment-view>
        </section>

      </div>
    </div>

    <!-- Side icons - collapsible group (hidden until invitation opened) -->
    <div
      class="side-icons-container"
      *ngIf="invitationOpened"
      role="complementary"
      aria-label="Side icon controls">
      <!-- Main toggle button - always visible -->
      <button
        class="side-icon-toggle"
        (click)="toggleSideIcons()"
        [attr.aria-expanded]="sideIconsVisible"
        [attr.aria-label]="sideIconsVisible ? 'Hide control options' : 'Show control options'"
        [class.expanded]="sideIconsVisible">
        <i class="fas fa-ellipsis-v" [class.rotated]="sideIconsVisible"></i>
      </button>

      <!-- Collapsible icons group -->
      <div class="side-icons-group" [class.visible]="sideIconsVisible" *ngIf="sideIconsVisible">
        <button class="side-icon-btn" aria-label="QR code" (click)="openQRCodeModal()">
          <i class="fas fa-qrcode"></i>
        </button>

        <button
          class="side-icon-btn"
          *ngIf="isMuted"
          (click)="toggleMute()"
          aria-label="Unmute audio">
          <i class="fas fa-volume-mute"></i>
        </button>

        <button
          class="side-icon-btn"
          *ngIf="!isMuted"
          (click)="toggleMute()"
          aria-label="Mute audio">
          <i class="fas fa-volume-up"></i>
        </button>

        <button
          class="side-icon-btn"
          *ngIf="isAudioLoading"
          aria-label="Loading audio"
          disabled>
          <i class="fas fa-spinner fa-spin"></i>
        </button>

        <button
          class="side-icon-btn"
          *ngIf="!isPlaying && !isAudioLoading"
          (click)="togglePlay()"
          [disabled]="isAudioLoading"
          aria-label="Putar musik">
          <i class="fas fa-play"></i>
        </button>

        <button
          class="side-icon-btn"
          *ngIf="isPlaying && !isAudioLoading"
          (click)="togglePlay()"
          [disabled]="isAudioLoading"
          aria-label="Jeda musik">
          <i class="fas fa-pause"></i>
        </button>
      </div>
    </div>

    <!-- Bottom navbar - hidden until invitation opened -->
    <nav class="bottom-navbar" *ngIf="invitationOpened">
      <div class="nav-container">
        <button class="nav-item"
          *ngIf="isMessagesVisible()"
          (click)="scrollToSection('section-messages')"
          [class.active]="currentActiveSection === 'section-messages'"
          data-bs-toggle="tooltip"
          data-bs-placement="top"
          title="Pesan">
          <i class="fas fa-envelope"></i>
        </button>
        <button class="nav-item"
          *ngIf="isFavoriteVisible()"
          (click)="scrollToSection('section-couple')"
          [class.active]="currentActiveSection === 'section-couple'"
          data-bs-toggle="tooltip"
          data-bs-placement="top"
          title="Favorit">
          <i class="fas fa-heart"></i>
        </button>
        <button class="nav-item"
          *ngIf="isCalendarVisible()"
          (click)="scrollToSection('section-akad')"
          [class.active]="currentActiveSection === 'section-akad'"
          data-bs-toggle="tooltip"
          data-bs-placement="top"
          title="Kalender">
          <i class="fas fa-calendar"></i>
        </button>
        <button class="nav-item"
          *ngIf="isBirthdayVisible()"
          (click)="scrollToSection('section-resepsi')"
          [class.active]="currentActiveSection === 'section-resepsi'"
          data-bs-toggle="tooltip"
          data-bs-placement="top"
          title="Ulang Tahun">
          <i class="fas fa-birthday-cake"></i>
        </button>
        <button class="nav-item"
          *ngIf="isChatVisible()"
          (click)="scrollToSection('section-story')"
          [class.active]="currentActiveSection === 'section-story'"
          data-bs-toggle="tooltip"
          data-bs-placement="top"
          title="Chat">
          <i class="fas fa-comment"></i>
        </button>
        <button class="nav-item"
          *ngIf="isGalleryVisible()"
          (click)="showGallery()"
          [class.active]="isCurrentView(ContentView.GALLERY)"
          data-bs-toggle="tooltip"
          data-bs-placement="top"
          title="Galeri">
          <i class="fas fa-images"></i>
        </button>
        <button class="nav-item"
          *ngIf="isProfileVisible()"
          (click)="scrollToSection('section-presence')"
          [class.active]="currentActiveSection === 'section-presence'"
          data-bs-toggle="tooltip"
          data-bs-placement="top"
          title="Profil">
          <i class="fas fa-user-check"></i>
        </button>
        <button class="nav-item"
          *ngIf="isGiftsVisible()"
          (click)="scrollToSection('section-gift')"
          [class.active]="currentActiveSection === 'section-gift'"
          data-bs-toggle="tooltip"
          data-bs-placement="top"
          title="Hadiah">
          <i class="fas fa-gift"></i>
        </button>
        <button class="nav-item"
          *ngIf="isCommentsVisible()"
          (click)="scrollToSection('section-comment')"
          [class.active]="currentActiveSection === 'section-comment'"
          data-bs-toggle="tooltip"
          data-bs-placement="top"
          title="Komentar">
          <i class="fas fa-comments"></i>
        </button>
      </div>
    </nav>
  </div>
</div>
