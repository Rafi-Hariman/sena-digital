<div class="container">
  <div class="row g-4">
    <!-- Left Form -->


    <!-- Right Form -->
    <form
      class="col-12 col-md-6 d-flex form-container"
      autocomplete="off"
      novalidate
      (submit)="onSubmitContact($event)"
    >
      <h2>Contact Admin</h2>

      <div class="mb-3">
        <label for="host-email" class="form-label">Host Email</label>
        <input
          id="host-email"
          name="host-email"
          type="email"
          [(ngModel)]="contactForm.host_email"
          placeholder="zayyin.alfar1@gmail.com"
          class="form-control"
          aria-describedby="host-email-desc"
          [disabled]="isSubmitting"
        />
        <div id="host-email-desc" class="form-text italic">
          Kosongkan jika tidak membutuhkan notifikasi email.
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="contactForm.email"
          placeholder="zayyin.alfar1@gmail.com"
          class="form-control"
          [disabled]="isSubmitting"
        />
      </div>

      <div class="mb-3">
        <label for="whatsapp" class="form-label">WhatsApp</label>
        <input
          id="whatsapp"
          name="whatsapp"
          type="text"
          [(ngModel)]="contactForm.whatsapp"
          placeholder="08123456789"
          class="form-control"
          [disabled]="isSubmitting"
        />
      </div>


      <div class="mb-3">
        <label for="whatsapp-token" class="form-label"
          >Token What'sApp Gateway</label
        >
        <input
          id="whatsapp-token"
          name="whatsapp-token"
          type="text"
          [(ngModel)]="contactForm.whatsapp_token"
          placeholder="720f91719af7632f1783305a6fbb1c0b65729755"
          class="form-control fst-italic text-secondary"
          [disabled]="isSubmitting"
        />
      </div>

      <div class="mb-5">
        <label for="whatsapp-message" class="form-label">Pesan What'sApp</label>
        <input
          id="whatsapp-message"
          name="whatsapp-message"
          type="text"
          [(ngModel)]="contactForm.whatsapp_message"
          placeholder="Hello Admin Ganteng ,Saya Mau bertanya."
          class="form-control"
          [disabled]="isSubmitting"
        />
      </div>

      <button type="submit" class="btn btn-simpan" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Menyimpan...' : 'Simpan' }}
      </button>
    </form>
  </div>
</div>
